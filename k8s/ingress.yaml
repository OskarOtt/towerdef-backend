apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: towerdef-backend
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - towerdef-api.oskott.com
      secretName: towerdef-backend-tls
  rules:
    - host: towerdef-api.oskott.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: towerdef-backend
                port:
                  number: 8080
