spring.application.name=towerdef-backend

spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USER}
spring.datasource.password=${DATABASE_PASSWORD}
# Liquibase owns the schema
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.xml
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

server.max-http-request-header-size=8KB
server.error.include-stacktrace=never
server.error.include-message=never

# Secret used to sign run tokens and hash IPs. MUST be overridden in production.
towerdef.security.secret=${TOWERDEF_SECRET:dev-only-secret-change-me-please-32chars}
towerdef.security.allowed-origins=${TOWERDEF_ALLOWED_ORIGINS:https://towerdef.io,https://www.towerdef.io,http://localhost:5173}
towerdef.security.trust-forwarded-for=${TOWERDEF_TRUST_FORWARDED_FOR:false}
towerdef.security.run-ttl-minutes=240
towerdef.rate-limit.start-per-minute=10
towerdef.rate-limit.submit-per-minute=5
towerdef.rate-limit.read-per-minute=60
