spring.datasource.url=${DATABASE_URL}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${DATABASE_USER}
spring.datasource.password=${DATABASE_PASSWORD}

# No dev defaults in production: fail fast if the secret is missing.
towerdef.security.secret=${TOWERDEF_SECRET}
towerdef.security.trust-forwarded-for=true

logging.level.no.oskott.towerdefbackend=INFO
